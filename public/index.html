<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NighThematic</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>NighThematic</h1>
    <h2>Generate AI Images (but only dark-themed :P)</h2>

    <main>
        <textarea id="promptInput" maxlength="300" placeholder="Describe the required image..." rows="3"></textarea>

        <button id="genBtn">Generate</button>

        <p id="charCount">0 / 300</p>

        <div id="status">just for styling</div>

        <div id="imageContainer">
            <img src="https://as1.ftcdn.net/jpg/02/44/43/50/1000_F_244435000_orBnSERPq9fO8MjkGnEH55FeKQKRPdm4.jpg" alt="" id="resultImg">  <!-- add hidden-->
        </div>

        <p id="errorMsg"> just testing</p> <!-- add hidden-->
    </main>

    <script src="script.js"></script>
</body>
</html>
